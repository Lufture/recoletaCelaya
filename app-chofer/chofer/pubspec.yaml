name: recolecta_chofer
description: App operativa para choferes del servicio de recolección de basura municipal de Celaya.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  supabase_flutter: ^2.12.4
  flutter_dotenv: ^6.0.1
  geolocator: ^14.0.2
  flutter_background_service: ^5.1.0
  permission_handler: ^12.0.1
  flutter_local_notifications: ^21.0.0
  flutter_map: ^8.3.0
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - .env