name: recolecta_celaya
description: "App ciudadana de recolección de basura - Celaya, Gto."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1
  supabase_flutter: ^2.8.4
  flutter_secure_storage: ^9.2.4
  path_provider: ^2.1.5
  http: ^1.6.0
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
